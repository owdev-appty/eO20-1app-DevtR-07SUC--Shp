<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="食事記録">
<meta name="theme-color" content="#141716">
<title>食事記録</title>
<link rel="stylesheet" href="css/app.css?v=20261029b">
</head>
<body>
<div class="app" id="app">
  <div class="test-banner hidden" id="test-banner">テスト版（本番のデータとは別に保存されます）</div>
  <main class="scroll" id="scroll"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="today">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6"/></svg>今日
    </button>
    <button data-tab="review">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V6M19 20v-5"/></svg>ふりかえり
    </button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24"><path d="M9.5 3.5h5M10.5 3.5v5.5L5.2 18a1.8 1.8 0 0 0 1.6 2.6h10.4a1.8 1.8 0 0 0 1.6-2.6L13.5 9V3.5"/><path d="M7.5 14.5h9"/></svg>プラン
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>記録・設定
    </button>
  </nav>
  <div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="toast-act" class="hidden"></button></div>
  <div class="backdrop" id="backdrop" data-action="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div class="sheet-body" id="sheet-body"></div></div>
  <input type="file" id="restore-file" accept="application/json,.json" class="hidden">
</div>
<noscript><p style="color:#E7EAE7;padding:16px;">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
<script type="module" src="js/app.js?v=20261029b"></script>
</body>
</html>
